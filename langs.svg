<rect x="0" y="6" height="7" rx="3.5" fill="#ffd43b" class="langBar" style="--bw:78.0px; animation-delay:0.55s;"/>
</g><g transform="translate(0,52)">
<text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#c9a8e0">HTML/CSS</text>
