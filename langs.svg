<rect x="0" y="6" height="7" rx="3.5" fill="#8a92b2" class="langBar" style="--bw:36.0px; animation-delay:0.85s;"/>
</g><g transform="translate(0,104)">
<text x="0" y="0" font-family="'Segoe UI',sans-serif" font-size="12.5" fill="#c9a8e0">C++</text>
