<style>
.bgCard { opacity:0; animation: cardIn .5s ease-out forwards; }
@keyframes cardIn { 0%{opacity:0;} 100%{opacity:1;} }
.trophyCell { opacity:0; transform-box: fill-box; transform-origin:center; animation-name: cellPop; animation-duration:.6s; animation-timing-function: cubic-bezier(.25,.9,.3,1.25); animation-fill-mode:forwards; }
@keyframes cellPop { 0%{opacity:0; transform:scale(.7) translateY(14px);} 100%{opacity:1; transform:scale(1) translateY(0);} }
.cellShine { animation-name: shineMove; animation-duration:2.6s; animation-iteration-count:infinite; animation-timing-function:ease-in-out; }
@keyframes shineMove { 0%{transform:translate(0,0) rotate(25deg); opacity:0;} 15%{opacity:1;} 55%{transform:translate(340px,0) rotate(25deg); opacity:0;} 100%{transform:translate(340px,0) rotate(25deg); opacity:0;} }
.trophyGlow { animation: glowPulse 2.2s ease-in-out infinite; }
@keyframes glowPulse { 0%,100%{ filter:drop-shadow(0 0 2px var(--tc)); } 50%{ filter:drop-shadow(0 0 9px var(--tc)); } }
</style>
