name: Generate Snake Animation

# Regenerates an animated "snake" that eats through Ahsan's GitHub
# contribution graph, then commits the SVGs to the `output` branch.
# README.md embeds the resulting files directly from that branch.

on:
  schedule:
    - cron: "0 3 * * *"   # every day at 03:00 UTC
  workflow_dispatch: {}     # allow manual runs from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ahsanidrees394
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-light.svg?color_snake=ff6bd6&color_dots=241033,3a1a4d,7a3ea8,b06bff,ff6bd6

      - name: Push the generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
